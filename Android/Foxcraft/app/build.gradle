plugins {
     id 'com.android.application'
}

def projectFenix = rootProject.projectDir.parentFile.parentFile
def nativeBuildDir = file("${projectFenix}/build/android-arm64")
def resourcesDir = file("${projectFenix}/Foxcraft/resources")

android {
    namespace = "org.libsdl.app"
    compileSdk 35
    buildToolsVersion = "36.1.0"
    defaultConfig {
        applicationId "com.projectfenix.foxcraft"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }
    sourceSets.main {
        jniLibs.srcDirs = ['src/main/jniLibs']
        assets.srcDirs += resourcesDir
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def syncNativeLibs = tasks.register('syncNativeLibs') {
    def outDir = file("${projectDir}/src/main/jniLibs/arm64-v8a")
    inputs.dir(nativeBuildDir)
    outputs.dir(outDir)
    doLast {
        outDir.mkdirs()
        copy {
            from file("${nativeBuildDir}/bin/sdl/libSDL3.so")
            into outDir
        }
        copy {
            from file("${nativeBuildDir}/Foxcraft/libmain.so")
            into outDir
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn syncNativeLibs
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
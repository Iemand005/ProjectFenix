plugins {
     id 'com.android.application'
}

def projectFenix = rootProject.projectDir.parentFile.parentFile
def arm64BuildDir = file("${projectFenix}/build/android-arm64")
def v7aBuildDir = file("${projectFenix}/build/android-armeabi-v7a")
def v7aFlatBuildDir = file("${projectFenix}/build/android-armeabi-v7a-flat")
def resourcesDir = file("${projectFenix}/Foxcraft/resources")
def stagedAssetsDir = file("${projectDir}/build/generated/stagedAssets")

android {
    namespace = "be.lasse.foxcraft"
    compileSdk 35
    buildToolsVersion = "37.0.0"
    ndkVersion "29.0.14206865"
    defaultConfig {
        applicationId "com.projectfenix.foxcraft"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }
    flavorDimensions "target"
    productFlavors {
        // Full XR APK: arm64-v8a + armeabi-v7a with the OpenXR loader (default).
        xr {
            dimension "target"
        }
        // 32-bit-only XR APK: excludes arm64-v8a for Android 5 / 32-bit-only
        // devices and headsets that only have an armeabi-v7a runtime.
        xr32 {
            dimension "target"
            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
        // Flat-screen-only APK: 32-bit, no OpenXR at all. The engine is built
        // with FE_EXCLUDE_OPENXR=ON so no XR code is compiled in and no
        // libopenxr_loader.so is packaged.
        flat {
            dimension "target"
            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
    }
    sourceSets.main {
        assets.srcDirs += stagedAssetsDir
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Native library layout per target flavor. Role -> build output path.
def nativeLibs = [
    xr: [
        arm64_v8a: [
            sdl:   "${arm64BuildDir}/bin/sdl/libSDL3.so",
            main:  "${arm64BuildDir}/Foxcraft/libmain.so",
            openxr: "${arm64BuildDir}/bin/openxr/src/loader/libopenxr_loader.so",
        ],
        armeabi_v7a: [
            sdl:   "${v7aBuildDir}/bin/sdl/libSDL3.so",
            main:  "${v7aBuildDir}/Foxcraft/libmain.so",
            openxr: "${v7aBuildDir}/bin/openxr/src/loader/libopenxr_loader.so",
        ],
    ],
    xr32: [
        armeabi_v7a: [
            sdl:   "${v7aBuildDir}/bin/sdl/libSDL3.so",
            main:  "${v7aBuildDir}/Foxcraft/libmain.so",
            openxr: "${v7aBuildDir}/bin/openxr/src/loader/libopenxr_loader.so",
        ],
    ],
    flat: [
        armeabi_v7a: [
            sdl:  "${v7aFlatBuildDir}/bin/sdl/libSDL3.so",
            main: "${v7aFlatBuildDir}/Foxcraft/libmain.so",
        ],
    ],
]

// Copies the CMake-built .so files into each flavor's jniLibs folder so the
// packaged APK only contains the ABIs/libs that flavor was made for (stale
// files in src/main/jniLibs never leak into the APK). Run this after rebuilding
// the native libs, or just assemble — it is wired into each variant's preBuild
// task when AGP exposes one.
def syncNativeLibs = tasks.register('syncNativeLibs') {
    group = 'build'
    description = 'Copies CMake-built native libraries into each flavor jniLibs folder'
    doLast {
        nativeLibs.each { flavorName, flavorLibs ->
            def jniRoot = file("${projectDir}/src/${flavorName}/jniLibs")
            flavorLibs.each { abi, libsByRole ->
                def outDir = file("${jniRoot}/${abi.replace('_', '-')}")
                outDir.mkdirs()
                libsByRole.each { role, path ->
                    def so = file(path)
                    if (!so.exists()) {
                        throw new GradleException(
                            "Missing native library for ${flavorName}/${abi}: ${path}\n" +
                            "Build it first with CMake, e.g.\n" +
                            "  cmake --preset android-armeabi-v7a-flat && cmake --build build/android-armeabi-v7a-flat")
                    }
                    copy { from so into outDir }
                }
            }
        }
    }
}

// AGP 9 removed the task-based variant API, so the per-variant preBuild wiring
// is done defensively after evaluation: if AGP still creates pre<Variant>Build
// tasks, sync runs right before each variant builds; otherwise the .so files
// already present in the flavor jniLibs folders are used as-is.
androidComponents {
    onVariants(androidComponents.selector().all()) { variant ->
        def flavorName = variant.flavorName
        def taskName = "pre${variant.name.capitalize()}Build"
        project.afterEvaluate {
            tasks.findByName(taskName)?.dependsOn(syncNativeLibs)
        }
    }
}

def stageAssets = tasks.register('stageAssets', Copy) {
    from(resourcesDir) {
        into 'resources'
    }
    into stagedAssetsDir
}

tasks.named('preBuild').configure {
    dependsOn stageAssets
    inputs.dir(resourcesDir)
    outputs.dir(stagedAssetsDir)
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
plugins {
     id 'com.android.application'
}

def projectFenix = rootProject.projectDir.parentFile.parentFile
def arm64BuildDir = file("${projectFenix}/build/android-arm64")
def v7aBuildDir = file("${projectFenix}/build/android-armeabi-v7a")
def resourcesDir = file("${projectFenix}/Foxcraft/resources")
def stagedAssetsDir = file("${projectDir}/build/generated/stagedAssets")

android {
    namespace = "org.libsdl.app"
    compileSdk 35
    buildToolsVersion = "37.0.0"
    ndkVersion "29.0.14206865"
    defaultConfig {
        applicationId "com.projectfenix.foxcraft"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }
    sourceSets.main {
        jniLibs.srcDirs = ['src/main/jniLibs']
        assets.srcDirs += stagedAssetsDir
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

def syncNativeLibs = tasks.register('syncNativeLibs') {
    def arm64Out = file("${projectDir}/src/main/jniLibs/arm64-v8a")
    def v7aOut = file("${projectDir}/src/main/jniLibs/armeabi-v7a")
    inputs.dir(arm64BuildDir)
    inputs.dir(v7aBuildDir)
    outputs.dir(arm64Out)
    outputs.dir(v7aOut)
    doLast {
        arm64Out.mkdirs()
        copy {
            from file("${arm64BuildDir}/bin/sdl/libSDL3.so")
            into arm64Out
        }
        copy {
            from file("${arm64BuildDir}/Foxcraft/libmain.so")
            into arm64Out
        }
        def arm64OpenXR = file("${arm64BuildDir}/bin/openxr/src/loader/libopenxr_loader.so")
        if (arm64OpenXR.exists()) {
            copy {
                from arm64OpenXR
                into arm64Out
            }
        }
        v7aOut.mkdirs()
        copy {
            from file("${v7aBuildDir}/bin/sdl/libSDL3.so")
            into v7aOut
        }
        copy {
            from file("${v7aBuildDir}/Foxcraft/libmain.so")
            into v7aOut
        }
        def v7aOpenXR = file("${v7aBuildDir}/bin/openxr/src/loader/libopenxr_loader.so")
        if (v7aOpenXR.exists()) {
            copy {
                from v7aOpenXR
                into v7aOut
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn syncNativeLibs
}

def stageAssets = tasks.register('stageAssets', Copy) {
    from(resourcesDir) {
        into 'resources'
    }
    into stagedAssetsDir
}

tasks.named('preBuild').configure {
    dependsOn stageAssets
    inputs.dir(resourcesDir)
    outputs.dir(stagedAssetsDir)
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}